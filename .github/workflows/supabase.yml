name: Deploy Supabase

# Vercel already auto-deploys the frontend on every push. The database and Edge
# Functions did NOT — they had to be pushed by hand, which is how migration 0004
# ended up sitting unapplied in production while the frontend that depended on it
# shipped (the recycle bin was broken live for weeks).
#
# This makes "push to GitHub and everything redeploys" actually true.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — qgcooulzzbjebwczjgis
#   SUPABASE_DB_PASSWORD   — the database password (Project Settings -> Database)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow a manual re-run from the Actions tab

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    if: github.event_name != 'pull_request'
    needs: [quality, database-contract]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      # Fail with a readable message instead of the CLI's "Access token not
      # provided", which doesn't say WHICH secret is missing or where to add it.
      - name: Check required secrets
        run: |
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${PROJECT_REF:-}" ]           || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them under: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF   qgcooulzzbjebwczjgis"
            echo "  SUPABASE_DB_PASSWORD   Supabase -> Project Settings -> Database"
            echo ""
            echo "Then re-run this workflow. Until it succeeds, the database and Edge"
            echo "Functions stay on their old versions even though Vercel has the new frontend."
            exit 1
          fi
          echo "All three secrets are present."

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Check R2 Edge Function secrets
        run: |
          set -euo pipefail
          names="$(supabase secrets list --project-ref "$PROJECT_REF" --output json | jq -r '.[].name')"
          missing=""
          for secret in R2_ACCOUNT_ID R2_BUCKET R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY QUEUE_CRON_SECRET; do
            grep -Fxq "$secret" <<<"$names" || missing="$missing $secret"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Supabase Edge Function secret(s):$missing"
            exit 1
          fi

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          for fn in hubspot-ingest enrich-kyc enrich-crm-company discover-jobs parse-quote ms-auth-start ms-auth-callback process-email-queue provider-status unsubscribe export-xlsx export-crm-records uploaded-file-merge company-attachments deal-archive-properties archive-hubspot-data storage-status storage-maintenance workspace-archive crm-workbook-template crm-source-rows crm-mailbox-archive crm-recovery; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done

      - name: Run transactional database security and performance tests
        run: |
          set -euo pipefail
          for test in \
            supabase/tests/authenticated_data_api_grants.sql \
            supabase/tests/hubspot_property_coverage.sql \
            supabase/tests/phase_j_security_posture.sql \
            supabase/tests/query_performance_regressions.sql \
            supabase/tests/crm_activity_export_destinations.sql \
            supabase/tests/crm_company_field_provenance.sql \
            supabase/tests/crm_pst_content_and_contacts.sql \
            supabase/tests/crm_recovery.sql \
            supabase/tests/crm_source_filters_and_counts.sql \
            supabase/tests/email_delivery_operations.sql \
            supabase/tests/legacy_archive_company_bloom.sql \
            supabase/tests/sales_crm_isolation.sql \
            supabase/tests/workspace_isolation.sql; do
            echo "::group::database test $test"
            supabase db query --linked --file "$test"
            echo "::endgroup::"
          done

      # The migration deliberately installs the controller disabled. Enable it
      # only after the matching admission/maintenance functions are live, so a
      # partial deployment can never admit imports against mixed versions.
      - name: Enable automatic storage recovery controller
        run: |
          supabase db query --linked "update public.storage_compaction_state
            set controller_enabled = true, updated_at = statement_timestamp()
            where id;"

      - name: Verify storage archive schedule
        run: |
          supabase db query --linked "do \$\$ begin
            if not exists (
              select 1 from vault.decrypted_secrets
              where name = 'queue_worker_url'
                and regexp_replace(decrypted_secret, '/process-email-queue/?$', '/storage-maintenance') ~ '/storage-maintenance$'
            ) then raise exception 'Valid queue_worker_url is required for storage maintenance'; end if;
            if not exists (
              select 1 from vault.decrypted_secrets
              where name = 'queue_cron_secret' and length(decrypted_secret) >= 16
            ) then raise exception 'Valid queue_cron_secret is required for storage maintenance'; end if;
            if not exists (
              select 1 from cron.job where jobname = 'storage-pressure-r2-archive' and active
            ) then raise exception 'storage-pressure-r2-archive cron job is not active'; end if;
            if not exists (
              select 1
              from cron.job job
              cross join public.storage_compaction_state recovery
              where job.jobname = 'storage-toast-compaction'
                and recovery.id
                and (not job.active or recovery.state in ('scheduled', 'running'))
            ) then raise exception 'storage-toast-compaction job state is inconsistent'; end if;
            if not exists (
              select 1 from public.storage_compaction_state where id and controller_enabled
            ) then raise exception 'automatic storage recovery controller is not enabled'; end if;
          end \$\$;"

  database-contract:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      - name: Start local Supabase and apply migrations
        run: |
          # A historical production migration expects the Vault-backed storage
          # cron to exist. Fresh local stacks have no Vault secrets, so inject
          # only that disposable prerequisite at the original migration point.
          cp supabase/tests/local_storage_archive_cron_fixture.sql \
            supabase/migrations/20260828154833_ci_storage_archive_cron_fixture.sql
          supabase start
          rm supabase/migrations/20260828154833_ci_storage_archive_cron_fixture.sql
      - name: Verify email delivery retry and history invariants
        run: |
          docker exec -i supabase_db_sales-outreach-tool \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/tests/email_delivery_operations.sql
      - name: Verify concurrent retry serialization
        run: |
          set -euo pipefail
          run_sql() {
            docker exec -i supabase_db_sales-outreach-tool \
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres
          }
          run_sql < supabase/tests/email_delivery_retry_concurrency_setup.sql
          run_sql < supabase/tests/email_delivery_retry_concurrency_a.sql > /tmp/retry-a.log &
          retry_a_pid=$!
          sleep 1
          run_sql < supabase/tests/email_delivery_retry_concurrency_b.sql > /tmp/retry-b.log
          wait "$retry_a_pid"
          cat /tmp/retry-a.log
          cat /tmp/retry-b.log
          run_sql < supabase/tests/email_delivery_retry_concurrency_verify.sql
