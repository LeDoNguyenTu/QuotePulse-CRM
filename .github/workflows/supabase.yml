name: Deploy Supabase

# Vercel already auto-deploys the frontend on every push. The database and Edge
# Functions did NOT — they had to be pushed by hand, which is how migration 0004
# ended up sitting unapplied in production while the frontend that depended on it
# shipped (the recycle bin was broken live for weeks).
#
# This makes "push to GitHub and everything redeploys" actually true.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — qgcooulzzbjebwczjgis
#   SUPABASE_DB_PASSWORD   — the database password (Project Settings -> Database)

on:
  push:
    branches: [main]
  workflow_dispatch: # allow a manual re-run from the Actions tab

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - uses: actions/checkout@v4

      # Fail with a readable message instead of the CLI's "Access token not
      # provided", which doesn't say WHICH secret is missing or where to add it.
      - name: Check required secrets
        run: |
          missing=""
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "${PROJECT_REF:-}" ]           || missing="$missing SUPABASE_PROJECT_REF"
          [ -n "${SUPABASE_DB_PASSWORD:-}" ]  || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Add them under: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  SUPABASE_ACCESS_TOKEN  https://supabase.com/dashboard/account/tokens"
            echo "  SUPABASE_PROJECT_REF   qgcooulzzbjebwczjgis"
            echo "  SUPABASE_DB_PASSWORD   Supabase -> Project Settings -> Database"
            echo ""
            echo "Then re-run this workflow. Until it succeeds, the database and Edge"
            echo "Functions stay on their old versions even though Vercel has the new frontend."
            exit 1
          fi
          echo "All three secrets are present."

      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          for fn in hubspot-ingest enrich-kyc discover-jobs parse-quote ms-auth-start ms-auth-callback process-email-queue unsubscribe export-xlsx uploaded-file-merge company-attachments archive-hubspot-data; do
            echo "::group::deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done
