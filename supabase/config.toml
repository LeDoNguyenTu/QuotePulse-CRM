# Supabase local/project config. `project_id` is a local label; it does not have
# to match your remote ref. Run `supabase link --project-ref <ref>` to connect.
project_id = "sales-outreach-tool"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# NOTE: this configures the LOCAL stack only. The hosted project's Site URL and
# redirect allow-list live in the Supabase dashboard (Authentication -> URL
# Configuration) and are NOT in this repo. The hosted default is
# http://localhost:3000, which is why production verification emails linked to a
# dead page — set it to the Vercel domain there.
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/ms-auth-callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# Edge functions. `verify_jwt = true` means the caller must pass a valid
# Supabase auth token. OAuth callbacks that are hit by redirect keep it true too
# because the SPA forwards the user's session token.
[functions.hubspot-ingest]
verify_jwt = true
[functions.enrich-kyc]
verify_jwt = true
[functions.discover-jobs]
verify_jwt = true
[functions.parse-quote]
verify_jwt = true
[functions.ms-auth-start]
verify_jwt = true
[functions.ms-auth-callback]
verify_jwt = true
[functions.process-email-queue]
verify_jwt = false
[functions.unsubscribe]
verify_jwt = false
[functions.export-xlsx]
verify_jwt = true
